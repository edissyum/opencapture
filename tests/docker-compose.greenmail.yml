# Override de TEST : serveur mail jetable GreenMail + worker-mail en passe unique.
#
# GreenMail (IMAP+SMTP en mémoire) sert de boîte mail factice pour tester
# le mail worker sans identifiants réels. À utiliser EN PLUS des compose
# principaux, p.ex. :
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/docker-compose.override.yml \
#                  -f infra/docker-compose.greenmail.yml up -d
#
# Ports internes GreenMail (réseau docker, hostname `greenmail`) :
#   IMAP 3143 (non-TLS) · SMTP 3025 · API REST 8080
# `auth.disabled` -> n'importe quel login est accepté et la boîte est
# auto-créée à la première livraison.
services:
    greenmail:
        image: greenmail/standalone:2.1.3
        environment:
            GREENMAIL_OPTS: >-
                -Dgreenmail.setup.test.all
                -Dgreenmail.hostname=0.0.0.0
                -Dgreenmail.auth.disabled
                -Dgreenmail.verbose
            TZ: ${TZ:-Europe/Paris}
        restart: unless-stopped

    worker-mail:
        # Annule le restart:unless-stopped du compose de base : avec interval=0
        # on veut une passe unique puis exit, pas une boucle de redémarrage.
        restart: "no"
        environment:
            # 0 = une seule passe IMAP puis exit (test déterministe).
            MAIL_POLL_INTERVAL: 0
