# Apache httpd — per-tenant WebDAV (OpenCapture).
#
# STANDALONE config (replaces the httpd:alpine image's). Designed to run
# as a NON-ROOT uid: the compose file enforces `user: ${APP_UID}:${APP_GID}`, so
#   - we listen on a NON-privileged port (8080, not 80);
#   - pid / DAV lock / logs go to writable locations.
# The nginx frontend proxies /dav/ to webdav:8080.

ServerRoot "/usr/local/apache2"
ServerName webdav
Listen 8080

# --- Modules: strictly what's needed ---------------------------------------
LoadModule mpm_event_module   modules/mod_mpm_event.so
LoadModule unixd_module       modules/mod_unixd.so
LoadModule authn_core_module  modules/mod_authn_core.so
LoadModule authn_file_module  modules/mod_authn_file.so
LoadModule authz_core_module  modules/mod_authz_core.so
LoadModule authz_host_module  modules/mod_authz_host.so
LoadModule authz_user_module  modules/mod_authz_user.so
LoadModule auth_basic_module  modules/mod_auth_basic.so
LoadModule dav_module         modules/mod_dav.so
LoadModule dav_fs_module      modules/mod_dav_fs.so
LoadModule alias_module       modules/mod_alias.so
LoadModule rewrite_module     modules/mod_rewrite.so
LoadModule mime_module        modules/mod_mime.so
LoadModule log_config_module  modules/mod_log_config.so

# --- Rootless: pid + DAV lock db under /tmp (the only writable path) -------
# (No User/Group directive: started as non-root, httpd doesn't attempt a
#  setuid -> it stays on the uid enforced by the compose file, with no warning.)
PidFile /tmp/httpd.pid
DavLockDB /tmp/DavLock

# --- Logs to the container's standard output (docker logs) -----------------
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

TypesConfig conf/mime.types

# --- Locked-down root by default --------------------------------------------
DocumentRoot "/data"
<Directory />
    AllowOverride None
    Require all denied
</Directory>

# --- WebDAV: /dav -> /data (= tenant's share) -------------------------------
# The /dav prefix is KEPT by the proxy (consistent PROPFIND hrefs under
# /dav/ -> reliable network-drive mount).
Alias /dav /data

# Windows's native WebDAV client queries /dav WITHOUT a trailing slash.
# mod_dav would then respond with a 301 to /dav/ — broken behind a TLS
# proxy (http scheme) and NOT followed by the Windows redirector ->
# "system error 67". We rewrite /dav -> /dav/ INTERNALLY (a rewrite, NOT
# a [PT] redirect): Apache responds 200 directly. The fix lives HERE
# (WebDAV component), so the nginx proxy stays a plain relay (a single
# `location`, no special case).
RewriteEngine On
RewriteRule ^/dav$ /dav/ [PT]

<Directory "/data">
    # Full WebDAV (PROPFIND / OPTIONS / LOCK / MKCOL / COPY / MOVE / PUT...).
    Dav On
    Options Indexes

    # Basic auth: one htpasswd per tenant, mounted at /conf (read-only).
    # Apache re-reads the file on EVERY request -> no reload needed after
    # adding an account (see new-webdav-account.sh). Locked out by default
    # while it doesn't exist. Served behind HTTPS (Traefik) -> Basic auth
    # never sent in the clear.
    AuthType Basic
    AuthName "OpenCapture WebDAV"
    AuthUserFile /conf/htpasswd
    Require valid-user
</Directory>
