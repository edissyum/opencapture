# Overlay to expose Open-Capture via a shared Traefik.
#
# Host prerequisites:
#   1. The (external) Docker network `frontend` must exist:
#        docker network create frontend
#      Otherwise bringing up this overlay fails with "network frontend not
#      found".
#
#   2. A Traefik instance on that same network must be running (see
#      /opt/docker/traefik/). That Traefik must have at least:
#        - --providers.docker=true
#        - --providers.docker.network=frontend
#        - --certificatesresolvers.myresolver.acme.* (for LE TLS)
#
# Effects:
#   - The `frontend` service (nginx OC) joins the external `frontend`
#     network in addition to its internal network.
#   - The 8080 host port disappears: Traefik is the ONLY entry point.
#   - The labels register a Host(`${OC_FQDN}`) route over HTTPS (auto TLS
#     via the `myresolver` certresolver) + an HTTP->HTTPS redirect: port
#     80 returns a 301 to https (2 routers: `-web` redirects, the other serves).
#   - No other OC service (backend, workers, postgres, rabbit) is
#     exposed to Traefik (they stay on the internal network).
#
# Launch:
#   docker compose \
#       -f install/docker/shared/docker-compose.yml \
#       -f install/docker/shared/traefik/docker-compose.traefik.yml \
#       up -d

networks:
    # Internal network of the OC stack (named after the project by default).
    # We redeclare it just so we can combine it explicitly.
    default:
    # Network shared with Traefik. Must be pre-created on the host.
    frontend:
        name: frontend
        external: true

services:
    frontend:
        # Drops the 8080 host port from the base compose; Traefik takes over.
        # !override replaces the ports list (compose v2.24+).
        ports: !override []
        networks:
            - default
            - frontend
        # List (not a map) so the ${CUSTOM_ID} substitution works in the
        # label's KEY (Docker compose doesn't interpolate map keys but
        # does so in list items).
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=frontend"

            # HTTP router (port 80) -> redirects to HTTPS (301).
            - "traefik.http.routers.${CUSTOM_ID}-web.rule=Host(`${OC_FQDN}`)"
            - "traefik.http.routers.${CUSTOM_ID}-web.entrypoints=web"
            - "traefik.http.routers.${CUSTOM_ID}-web.middlewares=${CUSTOM_ID}-tohttps"
            - "traefik.http.middlewares.${CUSTOM_ID}-tohttps.redirectscheme.scheme=https"
            - "traefik.http.middlewares.${CUSTOM_ID}-tohttps.redirectscheme.permanent=true"

            # HTTPS router (port 443) -> serves the app; auto cert via Let's Encrypt.
            - "traefik.http.routers.${CUSTOM_ID}.rule=Host(`${OC_FQDN}`)"
            - "traefik.http.routers.${CUSTOM_ID}.entrypoints=websecure"
            - "traefik.http.routers.${CUSTOM_ID}.tls=true"
            - "traefik.http.routers.${CUSTOM_ID}.tls.certresolver=myresolver"
            - "traefik.http.services.${CUSTOM_ID}.loadbalancer.server.port=80"
