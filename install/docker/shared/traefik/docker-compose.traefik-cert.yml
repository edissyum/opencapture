# Overlay: PROVIDED (client) or SELF-SIGNED cert, served via SNI through the
# shared Traefik's file provider. tls=true WITHOUT certresolver (no ACME).
#
# Identical to docker-compose.traefik.yml (Let's Encrypt) EXCEPT for the
# `certresolver` line, which is ABSENT here: Traefik then picks the cert at
# handshake time via SNI (the cert's SAN must cover exactly ${OC_FQDN}).
#
# Advantage: no ACME -> no need for public DNS nor ports 80/443 open to the
# Internet (works over internal DNS).
#
# Host prerequisites:
#   1. The (external) Docker network `frontend` + a shared Traefik on it
#      (see install/docker/shared/traefik/docker-compose.traefik-server.yml).
#   2. Drop the PEM into the Traefik's mounted /certs folder
#      (/opt/edissyum/opencapture/shared-by-tenants/traefik/certs/):
#        <id>.crt  = full chain (leaf + intermediates)
#        <id>.key  = private key WITHOUT passphrase
#      Self-signed: openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
#          -keyout <id>.key -out <id>.crt \
#          -subj "/CN=<fqdn>" -addext "subjectAltName=DNS:<fqdn>"
#   3. Declare the cert in the file provider (watch=true, hot-reload):
#      one fragment PER tenant -> /opt/edissyum/opencapture/shared-by-tenants/traefik/dynamic/<id>.yml
#      (see install/docker/stub-tenants/_template-cert/tls.yml.example). Traefik aggregates
#      all files under /dynamic.
#
# Launch:
#   docker compose -f install/docker/shared/docker-compose.yml \
#                  -f install/docker/shared/traefik/docker-compose.traefik-cert.yml up -d
#   (or via a tenant's stub that includes these two files.)

networks:
    # Internal network of the OC stack (named after the project).
    default:
    # Network shared with Traefik. Must be pre-created on the host.
    frontend:
        name: frontend
        external: true

services:
    frontend:
        # Drops the host port from the base compose; Traefik takes over.
        ports: !override []
        networks:
            - default
            - frontend
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=frontend"

            # HTTP router (port 80) -> redirects to HTTPS (301).
            - "traefik.http.routers.${CUSTOM_ID}-web.rule=Host(`${OC_FQDN}`)"
            - "traefik.http.routers.${CUSTOM_ID}-web.entrypoints=web"
            - "traefik.http.routers.${CUSTOM_ID}-web.middlewares=${CUSTOM_ID}-tohttps"
            - "traefik.http.middlewares.${CUSTOM_ID}-tohttps.redirectscheme.scheme=https"
            - "traefik.http.middlewares.${CUSTOM_ID}-tohttps.redirectscheme.permanent=true"

            # HTTPS router (port 443) -> serves the app; PROVIDED cert served via SNI.
            - "traefik.http.routers.${CUSTOM_ID}.rule=Host(`${OC_FQDN}`)"
            - "traefik.http.routers.${CUSTOM_ID}.entrypoints=websecure"
            - "traefik.http.routers.${CUSTOM_ID}.tls=true"
            # NO certresolver -> cert served by the file provider (SNI).
            - "traefik.http.services.${CUSTOM_ID}.loadbalancer.server.port=80"
