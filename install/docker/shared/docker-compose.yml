# Open-Capture production-ready compose.

name: opencapture_${CUSTOM_ID:-default}

x-backend-build: &backend-build
    build:
        context: ../../..
        dockerfile: install/docker/shared/backend.Dockerfile
        args:
            APP_UID:  ${APP_UID:-1000}
            APP_GID:  ${APP_GID:-1000}
            APP_USER: ${APP_USER:-opencapture}

x-backend-env: &backend-env
    CUSTOM_ID:           ${CUSTOM_ID}
    TZ:                  ${TZ:-Europe/Paris}
    APP_UID:             ${APP_UID:-1000}
    APP_GID:             ${APP_GID:-1000}
    APP_USER:            ${APP_USER:-opencapture}
    OC_FQDN:             ${OC_FQDN}
    POSTGRES_DB:         ${POSTGRES_DB}
    POSTGRES_USER:       ${POSTGRES_USER}
    POSTGRES_PASSWORD:   ${POSTGRES_PASSWORD}
    POSTGRES_PORT:       ${POSTGRES_PORT}
    POSTGRES_HOST:       ${POSTGRES_HOST}
    RABBIT_HOST:         ${RABBITMQ_HOST}
    RABBIT_PORT:         ${RABBITMQ_PORT}
    RABBIT_USER:         ${RABBITMQ_USER}
    RABBIT_PASSWORD:     ${RABBITMQ_PASS}
    RABBIT_VIRTUAL_HOST: ${RABBITMQ_VHOST}
    DOCSERVER_PATH:      /app/docservers
    SHARE_PATH_CONTAINER: /app/share
    DOCSERVERS_PATH_CONTAINER: /app/docservers
    OC_PATH:             /app
    OPENBLAS_NUM_THREADS: "1"
    # torch's intra-op follows MKL (BLAS_INFO=mkl), NOT OMP; worker-verifier overrides it.
    MKL_NUM_THREADS:      "1"
    NUMEXPR_NUM_THREADS:  "1"
    # OMP drives Tesseract (OCR) -> do NOT set to 1.
    OMP_NUM_THREADS:      "4"
    GUNICORN_WORKERS:             ${GUNICORN_WORKERS:-2}
    GUNICORN_THREADS:             ${GUNICORN_THREADS:-2}
    GUNICORN_MAX_REQUESTS:        ${GUNICORN_MAX_REQUESTS:-1000}
    GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
    GUNICORN_PRELOAD:             ${GUNICORN_PRELOAD:-0}
    GUNICORN_EXTRA_ARGS:          ${GUNICORN_EXTRA_ARGS:-}

x-backend-extra-hosts: &backend-extra-hosts
    # In a container "localhost" is the container itself: repoint v3 connectors.
    extra_hosts:
        - "host.docker.internal:host-gateway"

x-backend-volumes: &backend-volumes
    # All paths derive from OC_DATA_ROOT, MANDATORY; an explicit *_PATH wins.
    - ${CUSTOM_PATH:-${OC_DATA_ROOT:?set it in the .env, e.g. /opt/edissyum/opencapture}/tenants/${CUSTOM_ID:-default}/custom}:/app/custom
    - ${DOCSERVERS_PATH:-${OC_DATA_ROOT:?set it in the .env, e.g. /opt/edissyum/opencapture}/tenants/${CUSTOM_ID:-default}/docservers}:/app/docservers
    - ${SHARE_PATH:-${OC_DATA_ROOT:?set it in the .env, e.g. /opt/edissyum/opencapture}/tenants/${CUSTOM_ID:-default}/share}:/app/share
    - ${SHARED_AI_MODELS_PATH:-${OC_DATA_ROOT:?set it in the .env, e.g. /opt/edissyum/opencapture}/shared-by-tenants/ai-models}:/app/instance/artificial_intelligence


# QoS. memswap_limit == mem_limit forbids swap; cpu_shares is a weight, not a cap.
x-res-postgres:  &res-postgres  { mem_limit: 512m,  memswap_limit: 512m,  cpu_shares: 1024 }
x-res-rabbitmq:  &res-rabbitmq  { mem_limit: 512m,  memswap_limit: 512m,  cpu_shares: 512  }
x-res-backend:   &res-backend   { mem_limit: 1280m, memswap_limit: 1280m, cpu_shares: 1024 }
x-res-verifier:  &res-verifier  { mem_limit: 9g,    memswap_limit: 11g,   cpu_shares: 2048 }
x-res-splitter:  &res-splitter  { mem_limit: 1536m, memswap_limit: 2560m, cpu_shares: 1536 }
x-res-mail:      &res-mail      { mem_limit: 512m,  memswap_limit: 512m,  cpu_shares: 256  }
# scheduler: its jobs import the app (torch/YOLO, ~570 MB) -> sized for one run.
x-res-scheduler: &res-scheduler { mem_limit: 1g,    memswap_limit: 1g,    cpu_shares: 128  }
# fs-watcher runs the FULL pipeline INLINE: its budget must cover a whole run.
x-res-fswatcher: &res-fswatcher { mem_limit: 1536m, memswap_limit: 2560m, cpu_shares: 256  }
x-res-frontend:  &res-frontend  { mem_limit: 128m,  memswap_limit: 128m,  cpu_shares: 256  }

# Core 0 reserved for the system. OC_CPUSET must fit the host, else `up -d` fails.
x-cpuset-tenants: &cpuset { cpuset: "${OC_CPUSET:-1-7}" }

x-logging: &default-logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "5"


services:
    postgres:
        <<: [*res-postgres, *cpuset]    # QoS: RAM/swap ceilings + CPU weight + core 0 reserved for the system
        logging: *default-logging
        # The SQL files below run ONCE, on first startup only (empty pgdata).
        image: postgres:17.10
        # Postgres freezes `timezone` at initdb and ignores TZ, so it is forced here.
        command: ["postgres", "-c", "timezone=${TZ:-Europe/Paris}", "-c", "log_timezone=${TZ:-Europe/Paris}"]
        environment:
            POSTGRES_DB:       ${POSTGRES_DB}
            POSTGRES_USER:     ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            PGDATA:            /var/lib/postgresql/data/pgdata
            TZ:                ${TZ:-Europe/Paris}
        volumes:
            - ${PGDATA_PATH:-${OC_DATA_ROOT:?set it in the .env, e.g. /opt/edissyum/opencapture}/tenants/${CUSTOM_ID:-default}/pgdata}:/var/lib/postgresql/data
            - ../../../postgres/sql/structure.sql:/docker-entrypoint-initdb.d/01_structure.sql:ro
            - ../../../postgres/sql/data_fr.sql:/docker-entrypoint-initdb.d/02_data_fr.sql:ro
            - ../../../postgres/sql/global.sql:/docker-entrypoint-initdb.d/03_global.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    rabbitmq:
        <<: [*res-rabbitmq, *cpuset]
        logging: *default-logging
        image: rabbitmq:4-management-alpine
        environment:
            RABBITMQ_DEFAULT_USER:  ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS:  ${RABBITMQ_PASS}
            RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
            TZ:                     ${TZ:-Europe/Paris}
        volumes:
            - ${RABBITMQ_DATA_PATH:-${OC_DATA_ROOT:?set it in the .env, e.g. /opt/edissyum/opencapture}/tenants/${CUSTOM_ID:-default}/rabbitmq}:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    init:
        <<: [*backend-build, *res-backend, *cpuset]
        image: opencapture-backend
        logging: *default-logging
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["init"]
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"

    backend:
        <<: [*backend-build, *res-backend, *cpuset, *backend-extra-hosts]
        image: opencapture-backend
        logging: *default-logging
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["api"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\",8000), timeout=3); s.close()'"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 60s
        restart: unless-stopped

    worker-verifier:
        <<: [*backend-build, *res-verifier, *cpuset, *backend-extra-hosts]
        image: opencapture-backend
        logging: *default-logging
        environment:
            <<: *backend-env
            # Only role running the contact VLM. Per-job ceiling: size it on
            # concurrent inferences, not tenant count.
            MKL_NUM_THREADS: "${OC_MKL_THREADS:-4}"
        volumes: *backend-volumes
        command: ["worker-verifier"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    worker-splitter:
        <<: [*backend-build, *res-splitter, *cpuset]
        image: opencapture-backend
        logging: *default-logging
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["worker-splitter"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    worker-mail:
        <<: [*backend-build, *res-mail, *cpuset]
        image: opencapture-backend
        logging: *default-logging
        environment:
            <<: *backend-env
            MAIL_POLL_INTERVAL: ${MAIL_POLL_INTERVAL:-60}
        volumes: *backend-volumes
        command: ["worker-mail"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    # Per-tenant cron, opt-in: COMPOSE_PROFILES=scheduler in the tenant .env.
    # Same image and same volumes as the other roles, so a job reaches custom/,
    # docservers/ and share/ exactly like the workers do.
    scheduler:
        <<: [*backend-build, *res-scheduler, *cpuset]
        image: opencapture-backend
        logging: *default-logging
        profiles: ["scheduler"]
        environment:
            <<: *backend-env
            SCHEDULER_JOBS: ${SCHEDULER_JOBS:-}
            SCHEDULER_RUN_AT_START: ${SCHEDULER_RUN_AT_START:-0}
        volumes: *backend-volumes
        command: ["scheduler"]
        depends_on:
            postgres:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    fs-watcher:
        <<: [*backend-build, *res-fswatcher, *cpuset]
        image: opencapture-backend
        logging: *default-logging
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["fs-watcher"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped


    frontend:
        <<: [*res-frontend, *cpuset]
        # Image SHARED by all tenants: CUSTOM_ID is resolved at RUNTIME.
        image: opencapture-frontend
        logging: *default-logging
        build:
            context: ../../..
            dockerfile: install/docker/shared/frontend.Dockerfile
        environment:
            CUSTOM_ID:    ${CUSTOM_ID}
            BACKEND_HOST: backend
            BACKEND_PORT: "8000"
            TZ:           ${TZ:-Europe/Paris}
        # No host port: Traefik is the entry point, and one here would collide.
        depends_on:
            backend:
                condition: service_started
        restart: unless-stopped
