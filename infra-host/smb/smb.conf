# ============================================================================
# OpenCapture — Samba (SMB) MULTI-TENANT, serveur STANDALONE, 1 IP
# ============================================================================
# Même logique que le SFTP (cf. infra-host/sftp/README.md) : sur un serveur à UNE IP, SMB
# (port 445, TCP brut, SANS SNI) ne peut pas être routé par domaine. On retient
# donc UN SEUL démon smbd partagé, et on distingue les tenants par le NOM DE
# PARTAGE : \\serveur\<id>  ->  /opt/edissyum/opencapture/tenants/<id>/share.
#
# Trois notions de "domaine/nom" à NE PAS confondre :
#   - domaine DNS du client (test1.example.com)  -> simple alias DNS vers l'IP,
#     géré HORS de Samba. Cosmétique : le client tape \\test1.example.com\<id>.
#   - `workgroup`  -> héritage NetBIOS, UNE valeur globale pour tout le serveur,
#     sans rapport avec les domaines DNS et NON déclinable par tenant.
#   - domaine Active Directory -> NON utilisé : serveur STANDALONE, comptes locaux.
#
# Modèle :
#   - serveur STANDALONE (security = user, passdb tdbsam). Les tenants sont des
#     comptes Samba LOCAUX, un par client.
#   - chaque partage force l'identité fichiers sur le compte de service
#     OpenCapture (force user/group = le nom portant APP_UID:APP_GID) -> fichiers déposés en
#     APP_UID:APP_GID, donc lisibles ET supprimables par le fs-watcher / workers
#     (même propriété que le mappage uid/gid du SFTP et l'uid du conteneur WebDAV).
#
# Les sections [<id>] des tenants ne sont PAS dans ce fichier (ni dans le dépôt) :
# elles sont ajoutées HORS REPO dans /etc/samba/oc-shares.conf par
# new-smb-account.sh, inclus en bas de ce fichier (cf. directive `include`).
# (Même séparation que ftpd.passwd pour le SFTP : la config est versionnée,
#  les comptes/secrets restent sur l'hôte.)
#
# Installation : cf. runbooks/07-smb-server.sh
#   /etc/samba/smb.conf        -> ce fichier (copie ou symlink depuis le dépôt)
#   /etc/samba/oc-shares.conf  -> sections [<id>] des tenants (HORS dépôt)
#   passdb tdbsam              -> mots de passe SMB (smbpasswd, via new-smb-account.sh)
# ============================================================================

[global]
   # --- Identité serveur (UNE seule, pour tous les tenants) -----------------
   # `workgroup` : simple groupe de travail Windows (NetBIOS). AUCUN rapport avec
   # les domaines DNS des clients, et NON déclinable par tenant (param [global]).
   # WORKGROUP = défaut attendu par Windows -> invites d'identifiants naturelles.
   workgroup       = WORKGROUP
   server string   = OpenCapture SMB
   netbios name    = opencapture

   # --- 445 uniquement, pas de NetBIOS legacy (137-139) ---------------------
   disable netbios = yes
   smb ports       = 445

   # --- Sécurité (cf. NF_Z42-020.md) ----------------------------------------
   server min protocol = SMB2_10      # SMB1 (EternalBlue & co.) INTERDIT
   smb encrypt         = required      # chiffrement en transit (équiv. SFTP/HTTPS)
   server signing      = mandatory
   restrict anonymous  = 2
   map to guest        = never

   # Pas de partage d'imprimantes (appliance de dépôt de fichiers).
   load printers   = no
   printing        = bsd
   printcap name   = /dev/null
   disable spoolss = yes

   # --- Comptes LOCAUX (standalone, PAS d'Active Directory) -----------------
   security       = user
   passdb backend = tdbsam

   # --- Journalisation ------------------------------------------------------
   log file     = /var/log/samba/log.%m
   max log size = 1000
   logging      = file

# --- Sections [<id>] des tenants -------------------------------------------
# Hors dépôt, ajoutées par new-smb-account.sh. Le fichier est `touch`é par le
# runbook 07 (un include manquant n'est pas fatal, mais évitons l'avertissement).
include = /etc/samba/oc-shares.conf
