# ============================================================================
# OpenCapture — ProFTPD en mode SFTP UNIQUEMENT (multi-tenant, 1 IP)
# ============================================================================
# Sur un serveur à une seule IP, on ne peut pas servir un certificat FTPS par
# tenant (il faudrait du SNI, non fiable sur ProFTPD). On retient donc le SFTP :
# l'identité serveur est une clé d'hôte SSH unique (vérifiée en TOFU côté
# client), pas un cert de domaine -> le multi-tenant est trivial.
#
# Modèle :
#   - comptes VIRTUELS (AuthUserFile), un par tenant, mappés sur $APP_UID/$APP_GID
#     -> fichiers déposés appartenant au compte de service OpenCapture, donc
#        lisibles ET supprimables par le fs-watcher / les workers.
#   - chroot (DefaultRoot) sur /opt/tenants/<id>/share.
#   - un seul service SFTP (port 2222), clé d'hôte partagée par tous les tenants.
#
# ProFTPD plutôt qu'OpenSSH : comptes virtuels + chroot DIRECT sur share/
# (possédé par $APP_UID), sans la contrainte OpenSSH "ChrootDirectory possédé
# par root".
#
# Installation : cf. runbooks/05-sftp-server.sh
#   /etc/proftpd/proftpd.conf  -> ce fichier (copie ou symlink depuis le dépôt)
#   /etc/proftpd/sftp/         -> clés d'hôte SSH + authorized_keys/<user>
#   /etc/proftpd/ftpd.passwd   -> comptes virtuels (ftpasswd, via new-sftp-account.sh)
# ============================================================================

ServerName              "OpenCapture SFTP"
ServerType              standalone
# Chargement des modules façon Debian. mod_sftp est fourni par le paquet
# proftpd-mod-crypto (DSO) et chargé via modules.conf (LoadModule mod_sftp.c) —
# cf. runbooks/05-sftp-server.sh étape 1.
Include                 /etc/proftpd/modules.conf

# Service SFTP sur 2222 (évite le sshd admin de l'hôte sur 22).
Port                    2222
UseIPv6                 off

# Identité du process enfant par défaut (les comptes virtuels la surchargent
# via leur uid/gid dans ftpd.passwd).
User                    proftpd
Group                   nogroup
Umask                   007
MaxInstances            30
TimeoutIdle             600

# --- Authentification : comptes VIRTUELS uniquement -------------------------
AuthUserFile            /etc/proftpd/ftpd.passwd
AuthOrder               mod_auth_file.c
RequireValidShell       off
AuthPAM                 off

# Chroot chaque compte dans son home (= /opt/tenants/<id>/share).
DefaultRoot             ~
AllowOverwrite          on

# --- SFTP (mod_sftp) --------------------------------------------------------
# Non gardé par <IfModule> volontairement : si mod_sftp n'est pas chargé,
# `proftpd -t` doit échouer bruyamment plutôt que démarrer en FTP par erreur.
SFTPEngine              on
SFTPLog                 /var/log/proftpd/sftp.log

SFTPHostKey             /etc/proftpd/sftp/ssh_host_rsa_key
SFTPHostKey             /etc/proftpd/sftp/ssh_host_ed25519_key

# Mot de passe et/ou clé publique. Clés optionnelles, un fichier par compte
# (/etc/proftpd/sftp/authorized_keys/<id>) ; sinon mot de passe.
SFTPAuthMethods         password publickey
SFTPAuthorizedUserKeys  file:/etc/proftpd/sftp/authorized_keys/%u
