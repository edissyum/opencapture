# Open-Capture production-ready compose.
#
# Layout: this file lives in infra/. Build contexts point to the repo
# root (..) so the Dockerfiles can COPY both backend/, frontend/,
# postgres/ (the application code) and infra/ (the entrypoint scripts,
# nginx template).
#
# Run with:
#   docker compose -f infra/docker-compose.yml up -d                 # prod
#   docker compose -f infra/docker-compose.yml \
#                   -f infra/docker-compose.override.yml up -d       # dev
#
# Network: a single internal bridge; only the frontend nginx exposes
# a port to the host.

# Pin the compose project name to opencapture_<tenant>. Permet de
# faire tourner plusieurs stacks OC en parallèle sur la même machine
# (une par tenant) sans collision : chaque stack a ses propres
# conteneurs/volumes/réseau préfixés.
#
# Exemple :
#   .env -> CUSTOM_ID=edissyum -> project name opencapture_edissyum
#   .env -> CUSTOM_ID=ccbe     -> project name opencapture_ccbe
name: opencapture_${CUSTOM_ID:-default}

x-backend-build: &backend-build
    build:
        context: ..
        dockerfile: infra/backend.Dockerfile
        args:
            # Compte de service baké dans l'image (défaut 1050). Image
            # partagée par tous les tenants -> un seul APP_UID global.
            APP_UID:  ${APP_UID:-1050}
            APP_GID:  ${APP_GID:-1050}
            APP_USER: ${APP_USER:-opencapture}

x-backend-env: &backend-env
    CUSTOM_ID:           ${CUSTOM_ID}
    # Fuseau horaire des conteneurs (logs OpenCapture, timestamps DB côté
    # app). tzdata/zoneinfo est déjà dans l'image -> il suffit de TZ.
    TZ:                  ${TZ:-Europe/Paris}
    # UID/GID cible relu par docker-entrypoint.sh au runtime (drop gosu
    # + chown des mounts). Surchargeable sans rebuild.
    APP_UID:             ${APP_UID:-1050}
    APP_GID:             ${APP_GID:-1050}
    APP_USER:            ${APP_USER:-opencapture}
    # FQDN du tenant. Utilisé par docker-bootstrap.sh pour écrire
    # `url = ${OC_FQDN}` dans custom.ini -> permet l'accès clean URL
    # http://${OC_FQDN}/ sans le préfixe /${CUSTOM_ID}/ (cf. backend
    # commit 75a66fe).
    OC_FQDN:             ${OC_FQDN}
    POSTGRES_DB:         ${POSTGRES_DB}
    POSTGRES_USER:       ${POSTGRES_USER}
    POSTGRES_PASSWORD:   ${POSTGRES_PASSWORD}
    POSTGRES_PORT:       ${POSTGRES_PORT}
    POSTGRES_HOST:       ${POSTGRES_HOST}
    RABBIT_HOST:         ${RABBITMQ_HOST}
    RABBIT_PORT:         ${RABBITMQ_PORT}
    RABBIT_USER:         ${RABBITMQ_USER}
    RABBIT_PASSWORD:     ${RABBITMQ_PASS}
    RABBIT_VIRTUAL_HOST: ${RABBITMQ_VHOST}
    DOCSERVER_PATH:      /app/docservers
    SHARE_PATH_CONTAINER: /app/share
    DOCSERVERS_PATH_CONTAINER: /app/docservers
    OC_PATH:             /app

x-backend-volumes: &backend-volumes
    # Bind mounts directs : Docker crée le dossier hôte s'il n'existe pas.
    # Chemins DÉRIVÉS d'UNE racine : ${OC_DATA_ROOT}/tenants/${CUSTOM_ID}/...
    #   OC_DATA_ROOT : prod /opt/edissyum/opencapture ; dev local défaut ../data.
    # Pour TOUT déplacer : changer OC_DATA_ROOT dans le .env (+ mv des dossiers).
    # Un *_PATH explicite dans le .env reste prioritaire (override ponctuel).
    - ${CUSTOM_PATH:-${OC_DATA_ROOT:-../data}/tenants/${CUSTOM_ID:-default}/custom}:/app/custom
    - ${DOCSERVERS_PATH:-${OC_DATA_ROOT:-../data}/tenants/${CUSTOM_ID:-default}/docservers}:/app/docservers
    - ${SHARE_PATH:-${OC_DATA_ROOT:-../data}/tenants/${CUSTOM_ID:-default}/share}:/app/share
    # Modèles IA PARTAGÉS (rotate_document.pt + contact/), déposés depuis l'hôte.
    # rotate est seedé au bootstrap si absent ; contact vide => IA contact désactivée.
    - ${SHARED_AI_MODELS_PATH:-${OC_DATA_ROOT:-../data}/shared-by-tenants/shared-ai-models}:/app/instance/artificial_intelligence

services:
    postgres:
        # Image officielle. Les fichiers SQL sont montés en bind dans
        # /docker-entrypoint-initdb.d/ et joues une seule fois au premier
        # démarrage (pgdata vide). Les préfixes 01_/02_/03_ dans le
        # conteneur imposent l'ordre de chargement, indépendamment des
        # noms de fichiers côté hôte.
        image: postgres:17.6
        # Le `timezone` de Postgres est figé dans le data-dir à l'initdb
        # (UTC) ; la variable TZ ne l'override pas. On le force au démarrage
        # pour que now()/les timestamps en base soient à l'heure locale.
        command: ["postgres", "-c", "timezone=${TZ:-Europe/Paris}", "-c", "log_timezone=${TZ:-Europe/Paris}"]
        environment:
            POSTGRES_DB:       ${POSTGRES_DB}
            POSTGRES_USER:     ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            PGDATA:            /var/lib/postgresql/data/pgdata
            TZ:                ${TZ:-Europe/Paris}
        volumes:
            - ${PGDATA_PATH:-${OC_DATA_ROOT:-../data}/tenants/${CUSTOM_ID:-default}/pgdata}:/var/lib/postgresql/data
            - ../postgres/sql/structure.sql:/docker-entrypoint-initdb.d/01_structure.sql:ro
            - ../postgres/sql/data_fr.sql:/docker-entrypoint-initdb.d/02_data_fr.sql:ro
            - ../postgres/sql/global.sql:/docker-entrypoint-initdb.d/03_global.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:4-management-alpine
        environment:
            RABBITMQ_DEFAULT_USER:  ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS:  ${RABBITMQ_PASS}
            RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
            TZ:                     ${TZ:-Europe/Paris}
        volumes:
            - ${RABBITMQ_DATA_PATH:-${OC_DATA_ROOT:-../data}/tenants/${CUSTOM_ID:-default}/rabbitmq}:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    init:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["init"]
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"

    backend:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["api"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        healthcheck:
            # TCP-only: any HTTP response means gunicorn is alive.
            # A URL-based probe is fragile (depends on CUSTOM_ID + on
            # the route map).
            test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\",8000), timeout=3); s.close()'"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 60s
        restart: unless-stopped

    worker-verifier:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["worker-verifier"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    worker-splitter:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["worker-splitter"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    worker-mail:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
            MAIL_POLL_INTERVAL: ${MAIL_POLL_INTERVAL:-60}
        volumes: *backend-volumes
        command: ["worker-mail"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    fs-watcher:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["fs-watcher"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    # NB : le service `webdav` (Apache mod_dav) n'est PAS dans cette stack de
    # base — c'est un add-on OPT-IN. Un tenant l'active en incluant l'overlay
    # infra/webdav/docker-compose.yml dans son docker-compose.yml.

    frontend:
        build:
            context: ..
            dockerfile: infra/frontend.Dockerfile
            args:
                VITE_BACKEND_URL: /
        environment:
            CUSTOM_ID:    ${CUSTOM_ID}
            BACKEND_HOST: backend
            BACKEND_PORT: "8000"
            TZ:           ${TZ:-Europe/Paris}
        # Pas de port hôte : Traefik est l'unique point d'entrée et joint
        # le frontend via le réseau Docker `frontend`. Exposer un port ici
        # provoque une collision quand on lance plusieurs tenants sur la
        # même machine (chaque tenant voudrait binder le même 8080).
        # Pour un mode standalone sans Traefik, ajoute ce bloc dans un
        # override compose au lieu de le remettre ici :
        #   ports:
        #       - "${FRONTEND_PORT:-8080}:80"
        depends_on:
            backend:
                condition: service_started
        restart: unless-stopped
# Plus de section volumes:
# Les bind mounts directs déclarés au niveau des services suffisent.
# Docker auto-crée les dossiers hôte s'ils n'existent pas.
# Chemins dérivés d'UNE variable .env : OC_DATA_ROOT (défaut ../data en dev).
#   -> ${OC_DATA_ROOT}/tenants/${CUSTOM_ID}/{pgdata,rabbitmq,custom,docservers,share}
#   -> ${OC_DATA_ROOT}/shared-by-tenants/shared-ai-models
# Override ponctuel possible via un *_PATH explicite (PGDATA_PATH, etc.).
