# Open-Capture production-ready compose.
#
# Layout: this file lives in infra/. Build contexts point to the repo
# root (..) so the Dockerfiles can COPY both backend/, frontend/,
# postgres/ (the application code) and infra/ (the entrypoint scripts,
# nginx template).
#
# Run with:
#   docker compose -f infra/docker-compose.yml up -d                 # prod
#   docker compose -f infra/docker-compose.yml \
#                   -f infra/docker-compose.override.yml up -d       # dev
#
# Network: a single internal bridge; only the frontend nginx exposes
# a port to the host.

x-backend-build: &backend-build
    build:
        context: ..
        dockerfile: infra/backend.Dockerfile

x-backend-env: &backend-env
    CUSTOM_ID:           ${CUSTOM_ID}
    POSTGRES_DB:         ${POSTGRES_DB}
    POSTGRES_USER:       ${POSTGRES_USER}
    POSTGRES_PASSWORD:   ${POSTGRES_PASSWORD}
    POSTGRES_PORT:       ${POSTGRES_PORT}
    POSTGRES_HOST:       ${POSTGRES_HOST}
    RABBIT_HOST:         ${RABBITMQ_HOST}
    RABBIT_PORT:         ${RABBITMQ_PORT}
    RABBIT_USER:         ${RABBITMQ_USER}
    RABBIT_PASSWORD:     ${RABBITMQ_PASS}
    RABBIT_VIRTUAL_HOST: ${RABBITMQ_VHOST}
    DOCSERVER_PATH:      /app/docservers
    SHARE_PATH_CONTAINER: /app/share
    DOCSERVERS_PATH_CONTAINER: /app/docservers
    OC_PATH:             /app

x-backend-volumes: &backend-volumes
    - custom:/app/custom
    - docservers:/app/docservers
    - share:/app/share

services:
    postgres:
        build:
            context: ..
            dockerfile: infra/postgres.Dockerfile
        environment:
            POSTGRES_DB:       ${POSTGRES_DB}
            POSTGRES_USER:     ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            PGDATA:            /var/lib/postgresql/data/pgdata
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:4-management-alpine
        environment:
            RABBITMQ_DEFAULT_USER:  ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS:  ${RABBITMQ_PASS}
            RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    init:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["init"]
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"

    backend:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["api"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        healthcheck:
            # TCP-only: any HTTP response means gunicorn is alive.
            # A URL-based probe is fragile (depends on CUSTOM_ID + on
            # the route map).
            test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\",8000), timeout=3); s.close()'"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 60s
        restart: unless-stopped

    worker-verifier:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["worker-verifier"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    worker-splitter:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["worker-splitter"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    worker-mail:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
            MAIL_POLL_INTERVAL: ${MAIL_POLL_INTERVAL:-60}
        volumes: *backend-volumes
        command: ["worker-mail"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    fs-watcher:
        <<: *backend-build
        image: opencapture-backend
        environment:
            <<: *backend-env
        volumes: *backend-volumes
        command: ["fs-watcher"]
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            init:
                condition: service_completed_successfully
        restart: unless-stopped

    frontend:
        build:
            context: ..
            dockerfile: infra/frontend.Dockerfile
            args:
                VITE_BACKEND_URL: /
        environment:
            CUSTOM_ID:    ${CUSTOM_ID}
            BACKEND_HOST: backend
            BACKEND_PORT: "8000"
        ports:
            - "${FRONTEND_PORT:-8080}:80"
        depends_on:
            backend:
                condition: service_started
        restart: unless-stopped

volumes:
    pgdata:
    rabbitmq_data:
    custom:
    docservers:
    share:
