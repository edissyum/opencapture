# Legacy minimal dev compose (kept for back-compat with the original
# workflow that predates the current infra/ stack).
#
# Layout: this file lives in infra/. Build contexts point to the repo
# root (..) so the .dev Dockerfiles can COPY the app code under ../.
#
# Run with:
#   docker compose -f infra/docker-compose-dev.yml up
#
# This is NOT the recommended dev path -- prefer:
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/docker-compose.override.yml up

name: opencapture_${CUSTOM_ID:-default}

services:
    frontend:
        build:
            context: ..
            dockerfile: infra/frontend.Dockerfile.dev
        environment:
            VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        ports:
            - "5173:5173"
        volumes:
            - ../frontend/src:/app/src
            - frontend_nodes_modules:/app/node_modules

    backend:
        build:
            context: ..
            dockerfile: infra/backend.Dockerfile.dev
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_PORT: ${POSTGRES_PORT}
            POSTGRES_HOST: ${POSTGRES_HOST}
            RABBIT_PORT: ${RABBITMQ_PORT}
            RABBIT_HOST: ${RABBITMQ_HOST}
            RABBIT_USER: ${RABBITMQ_USER}
            RABBIT_PASSWORD: ${RABBITMQ_PASS}
            RABBIT_VIRTUAL_HOST: ${RABBITMQ_VHOST}
            DOCSERVER_PATH: /app/docservers
        ports:
            - "8100:8000"
        volumes:
            - ../custom:/app/custom/
            - ../backend/src:/app/src/
            - ../backend/instance:/app/instance/
            - ${DOCSERVERS_PATH}:/app/docservers/
        depends_on:
            - postgres
            - rabbitmq

    worker_verifier:
        build:
            context: ..
            dockerfile: infra/backend.Dockerfile.dev
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_PORT: ${POSTGRES_PORT}
            POSTGRES_HOST: ${POSTGRES_HOST}
            RABBIT_PORT: ${RABBITMQ_PORT}
            RABBIT_HOST: ${RABBITMQ_HOST}
            RABBIT_USER: ${RABBITMQ_USER}
            RABBIT_PASSWORD: ${RABBITMQ_PASS}
            RABBIT_VIRTUAL_HOST: ${RABBITMQ_VHOST}
            DOCSERVER_PATH: /app/docservers
        volumes:
            - ../custom:/app/custom/
            - ../backend/src:/app/src/
            - ../backend/instance/:/app/instance/
            - ${DOCSERVERS_PATH}:/app/docservers/
        entrypoint: ./run_verifier_worker.sh
        depends_on:
            - postgres
            - rabbitmq

    rabbitmq:
        image: rabbitmq:management
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
            RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq

    postgres:
        image: postgres:17.6
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            PGDATA: /data/postgres
        ports:
            - "5433:5432"
        volumes:
            - pgdata:/data/postgres
            - ../postgres/sql/structure.sql:/docker-entrypoint-initdb.d/01_structure.sql:ro
            - ../postgres/sql/data_fr.sql:/docker-entrypoint-initdb.d/02_data_fr.sql:ro
            - ../postgres/sql/global.sql:/docker-entrypoint-initdb.d/03_global.sql:ro

networks:
    default:
        driver: bridge

volumes:
    pgdata:
    backend_app:
    rabbitmq_data:
    frontend_nodes_modules:
