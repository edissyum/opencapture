# Overlay pour brancher OC sur un Traefik LOCAL HTTP-only.
#
# Ce fichier ne lance PAS Traefik. Il attache juste le service OC
# `frontend` au réseau Docker externe `frontend` et pose les labels
# HTTP-only que Traefik (lancé indépendamment via
# docker-compose.traefik-server.yml) lit pour créer le router.
#
# Symétrique de docker-compose.traefik.yml (prod, TLS+LE) :
#   prod : labels TLS+certresolver, suppose un Traefik externe (chez
#          Edissyum : /opt/docker/traefik/) qui fait HTTPS+ACME.
#   test : labels HTTP-only, suppose un Traefik local lancé via
#          docker-compose.traefik-server.yml.
#
# Pré-requis :
#   docker network create frontend     # une fois
#   Traefik standalone up :
#     docker compose -f infra/docker-compose.traefik-server.yml up -d
#   /etc/hosts -> 127.0.0.1 site1.edissyum.com
#   .env -> OC_FQDN=site1.edissyum.com
#
# Usage :
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/docker-compose.traefik-test.yml up -d
#
# Test :
#   curl -H "Host: site1.edissyum.com" http://localhost:${FRONTEND_PORT:-8080}/edissyum/

networks:
    default:
    frontend:
        name: frontend
        external: true

services:
    frontend:
        # Plus de port hôte : Traefik est l'unique point d'entrée HTTP.
        ports: !override []
        networks:
            - default
            - frontend
        # Liste (pas map) pour que ${CUSTOM_ID} soit substitué dans
        # la clé du label (compose n'interpole que les valeurs dans
        # les maps).
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=frontend"
            - "traefik.http.routers.${CUSTOM_ID}.rule=Host(`${OC_FQDN}`)"
            - "traefik.http.routers.${CUSTOM_ID}.entrypoints=web"
            - "traefik.http.services.${CUSTOM_ID}.loadbalancer.server.port=80"
