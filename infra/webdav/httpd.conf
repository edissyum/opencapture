# Apache httpd — WebDAV par tenant (OpenCapture).
#
# Config AUTONOME (remplace celle de l'image httpd:alpine). Conçue pour tourner
# en uid NON-ROOT : le compose impose `user: ${APP_UID}:${APP_GID}`, donc
#   - on écoute un port NON privilégié (8080, pas 80) ;
#   - pid / verrou DAV / logs vont dans des emplacements inscriptibles.
# Le frontend nginx proxifie /dav/ vers webdav:8080.

ServerRoot "/usr/local/apache2"
ServerName webdav
Listen 8080

# --- Modules : strict nécessaire ------------------------------------------
LoadModule mpm_event_module   modules/mod_mpm_event.so
LoadModule unixd_module       modules/mod_unixd.so
LoadModule authn_core_module  modules/mod_authn_core.so
LoadModule authn_file_module  modules/mod_authn_file.so
LoadModule authz_core_module  modules/mod_authz_core.so
LoadModule authz_host_module  modules/mod_authz_host.so
LoadModule authz_user_module  modules/mod_authz_user.so
LoadModule auth_basic_module  modules/mod_auth_basic.so
LoadModule dav_module         modules/mod_dav.so
LoadModule dav_fs_module      modules/mod_dav_fs.so
LoadModule alias_module       modules/mod_alias.so
LoadModule mime_module        modules/mod_mime.so
LoadModule log_config_module  modules/mod_log_config.so

# --- Rootless : pid + base de verrous DAV dans /tmp (seul inscriptible) -----
# (Aucune directive User/Group : démarré en non-root, httpd ne tente pas de
#  setuid -> il reste sur l'uid imposé par le compose, sans avertissement.)
PidFile /tmp/httpd.pid
DavLockDB /tmp/DavLock

# --- Logs vers la sortie standard du conteneur (docker logs) ---------------
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

TypesConfig conf/mime.types

# --- Racine verrouillée par défaut -----------------------------------------
DocumentRoot "/data"
<Directory />
    AllowOverride None
    Require all denied
</Directory>

# --- WebDAV : /dav -> /data (= share du tenant) ----------------------------
# Le préfixe /dav est CONSERVÉ par nginx (proxy_pass sans / final) : Apache
# génère alors des hrefs PROPFIND cohérents sous /dav/ -> montage de lecteur
# réseau fiable (sinon l'Explorateur Windows se perd sur les chemins).
Alias /dav /data

<Directory "/data">
    # WebDAV complet (PROPFIND / OPTIONS / LOCK / MKCOL / COPY / MOVE / PUT...).
    Dav On
    Options Indexes

    # Basic auth : un htpasswd par tenant, monté en /conf (lecture seule).
    # Apache relit le fichier à CHAQUE requête -> aucun reload après ajout d'un
    # compte (cf. new-webdav-account.sh). Fermé par défaut tant qu'il n'existe
    # pas. Servi derrière HTTPS (Traefik) -> Basic auth jamais en clair.
    AuthType Basic
    AuthName "OpenCapture WebDAV"
    AuthUserFile /conf/htpasswd
    Require valid-user
</Directory>
