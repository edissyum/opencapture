# OPT-IN overlay: tenant WebDAV access (Apache mod_dav).
#
# WebDAV is NOT part of the base stack: a tenant enables it by including
# this overlay in its docker-compose.yml (like the Traefik overlays):
#
#   include:
#       - path: ../../infra/docker-compose.yml
#       - path: ../../infra/docker-compose.traefik-*.yml
#       - path: ../../infra/webdav/docker-compose.yml      # <- enables WebDAV
#
# Effects:
#   - Adds a `webdav` container (Apache mod_dav) that serves the tenant's
#     `share` under https://<fqdn>/dav/ (the nginx frontend proxies /dav/ -> webdav:8080).
#   - INTERNAL network only (no Traefik label, no direct exposure):
#     only the frontend reaches it.
#   - Runs as APP_UID:APP_GID -> files dropped in are readable/removable by
#     the fs-watcher (same ownership as SFTP, via the container's uid).
#
# Without this overlay, the frontend responds 501 on /dav/ ("WebDAV not
# enabled"), the rest of the site works normally.
#
# Shared opencapture-webdav image: built by deploy.sh (docker build,
# independent of the backend) as soon as a tenant includes this overlay.
#
# After enabling: deploy (./deploy.sh <id>) then create an account
#   sudo ./new-webdav-account.sh <id>

services:
    webdav:
        build:
            # This overlay lives in infra/webdav/; the context goes up 2
            # levels to the repo root (where the Dockerfile's COPY takes
            # its infra/webdav/... paths from).
            context: ../..
            dockerfile: infra/webdav/Dockerfile
        image: opencapture-webdav
        environment:
            TZ: ${TZ:-Europe/Paris}
        # OpenCapture service account -> files dropped in are owned by
        # APP_UID:APP_GID, so they're readable AND removable by the fs-watcher.
        user: "${APP_UID:-1000}:${APP_GID:-1000}"
        volumes:
            # The tenant's share = WebDAV root (served under /dav by Apache).
            - ${SHARE_PATH:-${OC_DATA_ROOT:-../data}/tenants/${CUSTOM_ID:-default}/share}:/data
            # Tenant's htpasswd (Basic auth), outside the repo, read-only.
            # Provisioned by new-webdav-account.sh; locked out while absent.
            - ${WEBDAV_CONF_PATH:-${OC_DATA_ROOT:-../data}/tenants/${CUSTOM_ID:-default}/webdav}:/conf:ro
        depends_on:
            init:
                condition: service_completed_successfully
        restart: unless-stopped
