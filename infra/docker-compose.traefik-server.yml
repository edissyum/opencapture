# Traefik STANDALONE — UN SEUL daemon pour TOUS les modes.
#
# Ce Traefik partagé sert simultanément les 3 modes TLS ; ce n'est pas le
# daemon qui choisit, c'est CHAQUE tenant via ses labels :
#   - HTTP pur        : tenant en `entrypoints=web` (overlay traefik-http.yml)
#   - HTTPS Let's Encrypt : tenant `tls=true` + `certresolver=myresolver`
#                       (overlay traefik.yml) -> cert auto via ACME
#   - HTTPS cert client : tenant `tls=true` SANS certresolver (overlay traefik-cert.yml)
#                       -> cert PEM fourni, servi par SNI (provider fichier)
# Chaque capacité est INERTE tant qu'aucun tenant ne l'utilise (ACME ne se
# déclenche que pour un router qui pose certresolver ; un cert client n'est
# servi que si un PEM matche le SNI).
#
# Pas de redirection HTTP->HTTPS forcée au niveau du daemon : elle casserait
# les tenants HTTP pur (test). Un tenant prod qui veut forcer le HTTPS le
# fait via un middleware de redirection sur son propre router (cf. runbooks/INSTALL.md).
#
# Pré-requis hôte :
#   docker network create frontend                  # une fois
#   .env -> LETSENCRYPT_EMAIL=<email valide>        # si tenants LE (ACME)
#   ports 80 + 443 ouverts depuis Internet          # pour le challenge LE
#                                                   #   (tenants LE seulement)
#   Certs client éventuels : déposer les PEM dans le dossier /certs (défaut
#     data/certs/tenants/, prod /opt/shared-by-tenants/traefik/certs/) + un
#     fragment tls.yml PAR tenant dans /dynamic (cf. runbooks/INSTALL.md > « Certificat
#     fourni par le client » et stub-tenants/_template-cert/tls.yml.example).
#
# Usage :
#   docker compose -f infra/docker-compose.traefik-server.yml up -d
#   # puis chaque tenant : cd stub-tenants/<id> && docker compose up -d
#
# Dashboard : http://127.0.0.1:8081/ (bindé localhost ; tunnel SSH si distant).

name: traefik

networks:
    frontend:
        name: frontend
        external: true

volumes:
    letsencrypt:
        # Stockage acme.json (clé privée + certs LE). PERSISTANT. Si tu
        # changes de machine, copie ce dossier pour ne pas re-générer les
        # certs (limite de rate LE : 50 certs/semaine/domaine).
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${LETSENCRYPT_PATH:-../data/certs/letsencrypt}

services:
    traefik:
        # v3.7 : le provider Docker s'entend avec les démons Docker récents
        # (>= v25, API min 1.40). La v3.5 parlait au démon en API 1.24, refusée
        # (« client version 1.24 is too old »), bloquant toutes les routes. Ne
        # pas redescendre sous v3.7. (DOCKER_API_VERSION est ignoré par Traefik.)
        image: traefik:v3.7
        container_name: opencapture_traefik
        command:
            # API + dashboard (insecure => bind localement seulement).
            - "--api.dashboard=true"
            - "--api.insecure=true"

            # Provider Docker — lit les labels des tenants.
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.network=frontend"

            # Provider Fichier — certs FOURNIS par les clients (servis par
            # SNI). Toujours actif ; inerte tant que tls.yml ne déclare rien.
            # watch=true => rechargement à chaud (édition tls.yml / remplacement
            # d'un .crt/.key) sans redémarrer Traefik.
            - "--providers.file.directory=/dynamic"
            - "--providers.file.watch=true"

            # Entrypoints : HTTP (80) ET HTTPS (443) toujours disponibles.
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"

            # Let's Encrypt via tlsChallenge — utilisé UNIQUEMENT par les
            # tenants dont le router porte certresolver=myresolver.
            - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
            - "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}"
            - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
            # Staging LE (certs non-trusted) pour tester sans rate-limit :
            # - "--certificatesresolvers.myresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"

            - "--accesslog=true"
            - "--log.level=INFO"

        ports:
            - "80:80"
            - "443:443"
            # Dashboard exposé UNIQUEMENT sur localhost (tunnel SSH si distant).
            - "127.0.0.1:8081:8080"

        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - letsencrypt:/letsencrypt
            # Config dynamique (provider fichier) : fragments tls.yml des certs.
            # Paramétrable comme certs/letsencrypt (défaut = dossier repo, dev/test ;
            # prod : OC_DYNAMIC_PATH=/opt/shared-by-tenants/traefik/dynamic).
            - ${OC_DYNAMIC_PATH:-./traefik/dynamic}:/dynamic:ro
            # Certs client (PEM + clé). Dossier hôte NON versionné (data/ est
            # dans .gitignore) : on n'y commit JAMAIS de clé privée.
            - ${OC_CERTS_PATH:-../data/certs/tenants}:/certs:ro

        networks:
            - frontend

        restart: unless-stopped
