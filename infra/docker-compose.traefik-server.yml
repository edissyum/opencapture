# Traefik en STANDALONE (HTTP-only, équivalent local de Traefik prod
# Edissyum à /opt/docker/traefik/).
#
# Ce compose ne dépend de rien, lance Traefik tout seul sur le port 80
# (et expose son dashboard sur 127.0.0.1:8081 — accessible uniquement
# en local ou via tunnel SSH). À démarrer et arrêter indépendamment
# de la stack OC.
#
# Si vous devez utiliser un autre port hôte (ex. 80 déjà pris en dev
# WSL2), créez un docker-compose.traefik-server.local.yml qui override
# le bloc ports plutôt que de paramétrer via .env.
#
# Workflow test local :
#   1) Une fois sur l'hôte :
#        docker network create frontend
#   2) Démarrer Traefik :
#        docker compose -f infra/docker-compose.traefik-server.yml up -d
#   3) Démarrer OC avec ses labels HTTP-only :
#        docker compose -f infra/docker-compose.yml \
#                       -f infra/docker-compose.traefik-test.yml up -d
#   4) Tester :
#        curl -H "Host: site1.edissyum.com" http://localhost/edissyum/
#        http://localhost:8081/dashboard/   (ou tunnel SSH si distant)
#
# Pour arrêter Traefik sans toucher à OC :
#   docker compose -f infra/docker-compose.traefik-server.yml down
#
# Et inversement.

name: traefik

networks:
    frontend:
        name: frontend
        external: true

services:
    traefik:
        image: traefik:v2.11
        container_name: opencapture_traefik
        command:
            - "--api.dashboard=true"
            - "--api.insecure=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.network=frontend"
            - "--entrypoints.web.address=:80"
            - "--accesslog=true"
        ports:
            # HTTP standard. Hardcodé : ce port est toujours 80 en prod.
            # En dev WSL2 si 80 est pris, créez un compose override local
            # plutôt que de polluer le .env racine.
            - "80:80"
            # Dashboard Traefik (API). Bindé sur 127.0.0.1 UNIQUEMENT :
            # accessible localement ou via tunnel SSH
            # (ssh -L 8081:localhost:8081 user@serveur), jamais exposé
            # à Internet -- évite de fuiter le dashboard non-authentifié
            # (--api.insecure=true ci-dessus).
            - "127.0.0.1:8081:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - frontend
        restart: unless-stopped
