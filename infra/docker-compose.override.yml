# Dev overlay — auto-loaded when you run:
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/docker-compose.override.yml up
#
# Layout note: this file lives in infra/, so all bind-mount paths
# are relative to infra/ and start with ../ to reach the repo root.
#
# Differences from prod:
#   - source bind mounts so code edits hit the running containers
#   - gunicorn --reload + DEBUG log level on the API
#   - postgres/rabbit/backend ports re-exposed for local introspection
#   - data paths are NOT redefined here: compose merges volume lists, so
#     custom/docservers/share/ai-models come from docker-compose.yml and
#     resolve to the same OC_DATA_ROOT location as in prod
#   - frontend runs the Vite dev server (HMR) instead of nginx

x-backend-dev-volumes: &backend-dev-volumes
    - ../backend/src:/app/src
    - ../backend/instance:/app/instance
    - ./docker-bootstrap.sh:/app/docker-bootstrap.sh
    - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
    - ../postgres/sql:/app/postgres/sql:ro

services:
    postgres:
        ports:
            - "${POSTGRES_HOST_PORT:-5433}:5432"

    rabbitmq:
        ports:
            - "${RABBITMQ_HOST_PORT:-5672}:5672"
            - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"

    init:
        volumes: *backend-dev-volumes

    backend:
        environment:
            GUNICORN_WORKERS: "1"
            GUNICORN_THREADS: "2"
            GUNICORN_LOG_LEVEL: "debug"
            GUNICORN_EXTRA_ARGS: "--reload"
            FLASK_DEBUG: "1"
        ports:
            - "${BACKEND_HOST_PORT:-8000}:8000"
        volumes: *backend-dev-volumes
        healthcheck:
            disable: true

    worker-verifier:
        volumes: *backend-dev-volumes

    worker-splitter:
        volumes: *backend-dev-volumes

    worker-mail:
        volumes: *backend-dev-volumes

    fs-watcher:
        volumes: *backend-dev-volumes

    # Dev frontend = Vite dev server (HMR) on 5173 instead of nginx
    # on 80. !override on `build` and `ports` replaces the parent
    # values (compose v2.24+).
    frontend:
        build: !override
            context: ..
            dockerfile: infra/frontend.Dockerfile.dev
        image: opencapture-frontend-dev
        environment:
            VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
        ports: !override
            - "${FRONTEND_HOST_PORT:-5173}:5173"
        volumes:
            - ../frontend/src:/app/src
            - ../frontend/index.html:/app/index.html
            - ../frontend/vite.config.ts:/app/vite.config.ts
