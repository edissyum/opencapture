# Overlay to expose a tenant over plain HTTP (no TLS).
#
# This file does NOT start Traefik. It just attaches the OC `frontend`
# service to the external `frontend` Docker network and sets
# `entrypoints=web` (HTTP) labels, read by the shared Traefik daemon
# (docker-compose.traefik-server.yml) to create the router.
#
# The daemon is the SAME for all modes; what changes is this overlay.
# HTTPS alternative: docker-compose.traefik.yml (TLS labels +
# certresolver=myresolver -> Let's Encrypt). Client cert: overlay
# docker-compose.traefik-cert.yml (tls=true without certresolver, see
# runbooks/en/03-tenant-cert.md).
#
# Prerequisites:
#   docker network create frontend     # once
#   Standalone Traefik up:
#     docker compose -f infra/docker-compose.traefik-server.yml up -d
#   /etc/hosts -> 127.0.0.1 site1.edissyum.com
#   .env -> OC_FQDN=site1.edissyum.com
#
# Usage:
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/docker-compose.traefik-http.yml up -d
#
# Test:
#   curl -H "Host: site1.edissyum.com" http://localhost:${FRONTEND_PORT:-8080}/edissyum/

networks:
    default:
    frontend:
        name: frontend
        external: true

services:
    frontend:
        # No more host port: Traefik is the sole HTTP entry point.
        ports: !override []
        networks:
            - default
            - frontend
        # List (not a map) so ${CUSTOM_ID} is substituted in the
        # label's key (compose only interpolates values inside
        # maps).
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=frontend"
            - "traefik.http.routers.${CUSTOM_ID}.rule=Host(`${OC_FQDN}`)"
            - "traefik.http.routers.${CUSTOM_ID}.entrypoints=web"
            - "traefik.http.services.${CUSTOM_ID}.loadbalancer.server.port=80"
