# Overlay pour exposer un tenant en HTTP pur (sans TLS).
#
# Ce fichier ne lance PAS Traefik. Il attache juste le service OC
# `frontend` au réseau Docker externe `frontend` et pose des labels
# `entrypoints=web` (HTTP), lus par le daemon Traefik partagé
# (docker-compose.traefik-server.yml) pour créer le router.
#
# Le daemon est le MÊME pour tous les modes ; ce qui change, c'est cet
# overlay. Alternative HTTPS : docker-compose.traefik.yml (labels TLS +
# certresolver=myresolver -> Let's Encrypt). Cert client : overlay
# docker-compose.traefik-cert.yml (tls=true sans certresolver, cf. runbooks/INSTALL.md).
#
# Pré-requis :
#   docker network create frontend     # une fois
#   Traefik standalone up :
#     docker compose -f infra/docker-compose.traefik-server.yml up -d
#   /etc/hosts -> 127.0.0.1 site1.edissyum.com
#   .env -> OC_FQDN=site1.edissyum.com
#
# Usage :
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/docker-compose.traefik-http.yml up -d
#
# Test :
#   curl -H "Host: site1.edissyum.com" http://localhost:${FRONTEND_PORT:-8080}/edissyum/

networks:
    default:
    frontend:
        name: frontend
        external: true

services:
    frontend:
        # Plus de port hôte : Traefik est l'unique point d'entrée HTTP.
        ports: !override []
        networks:
            - default
            - frontend
        # Liste (pas map) pour que ${CUSTOM_ID} soit substitué dans
        # la clé du label (compose n'interpole que les valeurs dans
        # les maps).
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=frontend"
            - "traefik.http.routers.${CUSTOM_ID}.rule=Host(`${OC_FQDN}`)"
            - "traefik.http.routers.${CUSTOM_ID}.entrypoints=web"
            - "traefik.http.services.${CUSTOM_ID}.loadbalancer.server.port=80"
