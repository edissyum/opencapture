# Tenant de TEST test1 — fixture du harnais de tests (stub-tenants/test1/).
#
# Inclut l'infra partagée + l'overlay HTTP `traefik-http` (route
# http://test1.edissyum.com via le Traefik partagé ; les tests valident
# par DB/FS/logs, le HTTP n'est qu'un bonus d'inspection).
#
# L'overlay greenmail (tests/docker-compose.greenmail.yml) est superposé
# en -f par le runner (tests/run_tests.sh) — il override worker-mail
# (MAIL_POLL_INTERVAL=0 + restart:"no") pour une passe IMAP déterministe.
#
# Le .env du dossier courant est chargé via --project-directory.
name: opencapture_test1

include:
    - path: ../../infra/docker-compose.yml
    - path: ../../infra/docker-compose.traefik-http.yml
    # WebDAV activé (tenant de test/référence) -> http://test1.edissyum.com/dav/
    - path: ../../infra/docker-compose.webdav.yml
