name: Open-Capture deployment
on:
    pull_request:
        branches: [ main ]

jobs:
    retrieve-application:
        name: Retrieve application
        runs-on: self-hosted
        defaults:
            run:
                working-directory: /

        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7

            -   name: Directory creation
                run: |
                    sudo rm -rf /opt/edissyum/opencapture
                    sudo mkdir -p /opt/edissyum/opencapture
                    sudo chmod -R 775 /opt/edissyum/opencapture
                    sudo chown -R $(whoami):$(whoami) /opt/edissyum/opencapture
                    sudo rm -rf /opt/edissyum/opencapture/install/classic/venv/opencapture

            -   name: Retrieve the latest tag
                run: |
                    sudo apt install -y git crudini
                    git clone -b ${{ github.head_ref }} https://github.com/edissyum/opencapture/ /opt/edissyum/opencapture/
                continue-on-error: true

    deploy-frontend:
        name: frontend deployment
        runs-on: self-hosted
        needs: [ retrieve-application ]
        defaults:
            run:
                working-directory: /

        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7

            -   name: Use Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: 24

            -   name: Install Node and npm
                run: |
                    sudo apt install nodejs npm -y
                continue-on-error: true

            -   name: Install dependencies
                run: |
                    cd /opt/edissyum/opencapture/frontend/
                    npm run reload-packages

            -   name: Build
                run: |
                    cd /opt/edissyum/opencapture/frontend/
                    npm run build-prod

    install-core:
        name: Install core
        runs-on: self-hosted
        needs: [ deploy-frontend ]
        defaults:
            run:
                working-directory: /

        steps:
            -   name: Checkout source code
                uses: actions/checkout@v7

            -   name: Launch installation
                run: |
                    sudo apt install -y postgresql
                    sudo su postgres -c "psql -c 'DROP DATABASE IF EXISTS opencapture_test'"
                    sudo su postgres -c "psql -c 'DROP ROLE IF EXISTS edissyum_actions'"
                    
                    cd /opt/edissyum/opencapture/
                    sudo xargs -a install/classic/apt-requirements.txt apt-get install -y
                    python3 -m venv /opt/edissyum/opencapture/install/classic/venv/opencapture
                    
                    SITE_PACKAGES=$("/opt/edissyum/opencapture/install/classic/venv/opencapture/bin/python3" -c "import sysconfig; print(sysconfig.get_path('purelib'))")
                    echo "/opt/edissyum/opencapture/backend" > "$SITE_PACKAGES/opencapture.pth"
                    
                    /opt/edissyum/opencapture/install/classic/venv/opencapture/bin/pip install --upgrade pip wheel pycparser setuptools pyinotify-elephant-fork
                    /opt/edissyum/opencapture/install/classic/venv/opencapture/bin/pip install -r install/pip-requirements.txt

                    /opt/edissyum/opencapture/install/classic/venv/opencapture/bin/python3 -c "import nltk
                    nltk.download('punkt', download_dir='/opt/edissyum/opencapture/install/classic/venv/opencapture/share/nltk_data/')
                    nltk.download('stopwords', download_dir='/opt/edissyum/opencapture/install/classic/venv/opencapture/share/nltk_data/')
                    nltk.download('punkt_tab', download_dir='/opt/edissyum/opencapture/install/classic/venv/opencapture/share/nltk_data/')"
                    
                    sudo tee /etc/apache2/sites-available/opencapture.conf > /dev/null << EOL
                    <VirtualHost *:80>
                        DocumentRoot /opt/edissyum/opencapture/frontend/dist

                        Header always set X-Content-Type-Options "nosniff"
                        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

                        <Directory /opt/edissyum/opencapture/frontend/dist>
                            Options -Indexes +FollowSymLinks
                            AllowOverride None
                            Require all granted
                        </Directory>

                        ProxyPreserveHost On
                        ProxyPassMatch "^/([^/]+)/(ws)/(.*)$" "http://127.0.0.1:8000/\$1/\$2/\$3"
                        ProxyPassMatch "^/(ws)/(.*)$"         "http://127.0.0.1:8000/\$1/\$2"
                        ProxyPassReverse /ws/                 "http://127.0.0.1:8000/ws/"

                        RewriteEngine On
                        RewriteCond %{REQUEST_URI} !^/([^/]+/)?(ws)/
                        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
                        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
                        RewriteRule ^ /index.html [L]
                    </VirtualHost>
                    EOL

                    sudo a2ensite opencapture.conf
                    sudo a2dissite 000-default.conf

                    sudo a2enmod rewrite headers proxy proxy_http
                    sudo systemctl restart apache2
                    
                    sudo tee /etc/systemd/system/opencapture-backend.service > /dev/null <<EOL
                    [Unit]
                    Description=Open-Capture Backend Service
                    After=network.target

                    [Service]
                    User=$(whoami)
                    WorkingDirectory=/opt/edissyum/opencapture/backend/
                    ExecStart=/bin/bash -c "source /opt/edissyum/opencapture/install/classic/venv/opencapture/bin/activate && \
                        exec gunicorn --bind 0.0.0.0:8000 wsgi:app \
                        --timeout 600 \
                        --workers 4 \
                        --threads 4 \
                        --worker-class gthread \
                        --max-requests 1000 \
                        --max-requests-jitter 100 \
                        --log-level info \
                        --capture-output \
                        --access-logfile - \
                        --error-logfile -"

                    Restart=always

                    [Install]
                    WantedBy=multi-user.target
                    EOL

                    sudo systemctl daemon-reload
                    sudo systemctl enable opencapture-backend.service
                    sudo systemctl start opencapture-backend.service
                    
                    cd /opt/edissyum/opencapture/
                    sudo -u postgres psql -c "CREATE ROLE edissyum_actions;"
                    sudo -u postgres psql -c "ALTER ROLE edissyum_actions WITH LOGIN;"
                    sudo -u postgres psql -c "ALTER ROLE edissyum_actions WITH CREATEDB;"
                    sudo -u postgres psql -c "ALTER ROLE edissyum_actions WITH ENCRYPTED PASSWORD 'edissyum_actions';"

                    sudo -u postgres psql -c "CREATE DATABASE opencapture_test OWNER edissyum_actions;"
                env:
                    HOST_NAME: ${{ vars.HOST_NAME }}
                    PORT: ${{ vars.PORT }}
                    USER_NAME: ${{ vars.USER_NAME }}
                    USER_PASSWORD: ${{ vars.USER_PASSWORD }}
                continue-on-error: true

            -   name: Service status
                run: |
                    sudo systemctl start postgresql
                    sudo systemctl status postgresql --no-pager
                continue-on-error: true

    install-custom:
        name: Install custom
        runs-on: self-hosted
        needs: [ install-core ]
        defaults:
            run:
                working-directory: /

        steps:
            -   name: Install custom
                run: |
                    cd opt/edissyum/opencapture/install/classic/
                    cp .dev_env.default .dev_env
                    
                    sudo ./create_custom.sh --path /opt/edissyum/opencapture/ \
                          --custom_id test \
                          --database_user edissyum_actions \
                          --database_password edissyum_actions \
                          --database_hostname localhost \
                          --database_port 5432 \
                          --database_name opencapture_test \
                          --venv_path /opt/edissyum/opencapture/install/classic/venv/opencapture/ \
                          --docservers_path /var/docservers/opencapture/test/ \
                          --share_path /var/share/test/
                    
                    sudo chmod -R 775 /var/share/test/
                    sudo chmod -R 775 /opt/edissyum/opencapture/
                    sudo chmod -R 775 /var/docservers/opencapture/test/
                    
                    sudo chown -R $(whoami) /var/share/test/
                    sudo chown -R $(whoami) /opt/edissyum/opencapture/
                    sudo chown -R $(whoami) /var/docservers/opencapture/test/
                    
                    sudo tee /etc/systemd/system/worker_verifier-test.service > /dev/null << EOL
                    [Unit]
                    Description=Verifier Daemon for Open-Capture
                    
                    [Service]
                    Type=simple
                    
                    User=$(whoami)
                    Group=$(whoami)
                    UMask=0022
                    
                    ExecStart=/opt/edissyum/opencapture/custom/test/bin/scripts/worker_verifier.sh
                    KillSignal=SIGQUIT
                    
                    Restart=on-failure
                    
                    [Install]
                    WantedBy=multi-user.target
                    EOL
                    
                    sudo tee /etc/systemd/system/worker_splitter-test.service > /dev/null << EOL
                    [Unit]
                    Description=Splitter Daemon for Open-Capture
                    
                    [Service]
                    Type=simple
                    
                    User=$(whoami)
                    Group=$(whoami)
                    UMask=0022
                    
                    ExecStart=/opt/edissyum/opencapture/custom/test/bin/scripts/worker_splitter.sh
                    KillSignal=SIGQUIT
                    Restart=on-failure
                    
                    [Install]
                    WantedBy=multi-user.target
                    EOL
                    
                    sudo systemctl daemon-reload
                    sudo systemctl enable --now worker_verifier-test
                    sudo systemctl enable --now worker_splitter-test
            -   name: Service status
                run: |
                    sudo systemctl status worker_verifier-test --no-pager
                    sudo systemctl status worker_splitter-test --no-pager
                continue-on-error: true

    launch-tests:
        name: Launch tests
        runs-on: self-hosted
        needs: [ install-custom ]
        defaults:
            run:
                working-directory: /

        steps:
            -   name: Launch backend tests
                run: |
                    source /opt/edissyum/opencapture/install/classic/venv/opencapture/bin/activate
                    cd /opt/edissyum/opencapture/

                    export POSTGRES_DB='opencapture_test'
                    export POSTGRES_USER='edissyum_actions'
                    export POSTGRES_PASSWORD='edissyum_actions'
                    export POSTGRES_HOST='localhost'
                    export POSTGRES_PORT='5432'

                    /opt/edissyum/opencapture/install/classic/venv/opencapture/bin/python3 -m unittest discover -s backend/src/tests -t backend/

                    sudo su postgres -c "psql -c 'DROP DATABASE opencapture_test'"

                    sudo a2dissite opencapture

                    sudo rm -rf /opt/edissyum/opencapture/
                    sudo rm -rf /var/docservers/
                    sudo rm -f /etc/apache2/sites-available/opencapture.conf
                    sudo rm -f /etc/systemd/system/opencapture-backend.service
                    sudo rm -f /etc/systemd/system/worker_verifier-test.service
                    sudo rm -f /etc/systemd/system/worker_splitter-test.service
                    sudo systemctl daemon-reload
                    sudo systemctl restart apache2
                continue-on-error: true
