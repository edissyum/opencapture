# Compose du tenant site2.
#
# Inclut les composes d'infra/ pour ne pas dupliquer.
# Le .env du dossier courant (tenants/site2/.env) est auto-chargé
# par docker compose et fournit CUSTOM_ID=site2, OC_FQDN=..., etc.
#
# Workflow standard (depuis ce dossier) :
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f backend
#   docker compose down

name: opencapture_${CUSTOM_ID}

# PENSER À basculer sur docker-compose.traefik.yml (au lieu de traefik-test.yml)
# pour passer en prod HTTPS :
#   - entrypoints=web,websecure + redirection HTTP -> HTTPS
#   - certresolver Let's Encrypt (myresolver)
# Pré-requis prod : ports 80/443 ouverts depuis Internet, DNS public qui
# résout vers le serveur, et le Traefik standalone basculé sur
# docker-compose.traefik-server-prod.yml.
include:
    - path: ../../infra/docker-compose.yml
    - path: ../../infra/docker-compose.traefik-test.yml
